[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (QML), excluded from CI",
    "system: end-to-end runs on the preloaded datasets (System Validation Report)",
]

[tool.pylint.basic]
# A test's name says what it checks; a docstring would only repeat it.
no-docstring-rgx = "^(_|test_)"

[tool.bandit]
exclude_dirs = [".venv", "venv"]

[tool.bandit.assert_used]
# pytest checks results with plain assert statements, so B101 is expected in tests.
# It still applies to application code, where an assert can vanish under python -O.
skips = ["*/tests/*"]
