[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (QML), excluded from CI",
]

[tool.pylint.basic]
# A test's name says what it checks; a docstring would only repeat it.
no-docstring-rgx = "^(_|test_)"
