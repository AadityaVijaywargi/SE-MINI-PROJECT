[pytest]
# Black-box system tests (STP FSPP-MTP02.0 section 8.10). Run with run_tests.ps1.
testpaths = .
python_files = test_*.py
addopts = --browser-channel chrome -p no:cacheprovider --strict-markers -ra
markers =
    st(id): system test case ID from System_Test_Cases.xlsx
    slow: long-running case (large dataset or full model set)
    partial: partially automatable case; manual review remains
    manual: manual-only case; never executed by the script
