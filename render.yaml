# SM-77 (OTH-3): Render blueprint. Every merge to main redeploys automatically.
services:
  - type: web
    name: prediction-platform
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "5000"
      # Comma-separated origins allowed to call the API from another site; leave empty
      # when the UI is served by this app.
      - key: CORS_ORIGINS
        value: ""
      - key: UPLOAD_DIR_MAX_MB
        value: "200"
