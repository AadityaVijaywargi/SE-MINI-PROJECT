# SM-74, SM-76: lint and test every push and pull request (OTH-1, CON-7), then build the
# container, boot it and call /api/health as a smoke test (OTH-2).
name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r .

      - name: Test with coverage (pytest, excluding slow tests)
        run: pytest -m "not slow" -q --cov=core --cov=app --cov-report=term-missing

  docker-smoke-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t prediction-platform:ci .

      - name: Boot the container
        run: docker run -d --name app -p 5000:5000 prediction-platform:ci

      - name: Wait for /api/health (40 s start period, PERF-6)
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo; echo "healthy after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Check the container runs as a non-root user (SEC-8)
        run: test "$(docker exec app id -u)" = "1000"

      - name: Stop the container
        if: always()
        run: docker rm -f app
